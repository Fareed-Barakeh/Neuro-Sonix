<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroSonix Player</title>
<style>
  :root {
    --bg: #0c0c0e;
    --panel: #17181d;
    --panel-edge: #2c2e36;
    --text-1: #f2f0e8;
    --text-2: #9a9fae;
    --text-3: #6b6f7c;
    --melody: #3987e5;
    --harmony: #d95926;
    --bass: #199e70;
    --countermelody: #9085e9;
    --arpeggio: #eec24c;
    --perc-kick: #e8e8e8;
    --perc-hihat: #7c7c82;
    --perc-crash: #eec24c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-1);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px 60px;
  }
  main { width: 100%; max-width: 1100px; }

  .kicker {
    font-family: ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--melody);
    margin: 0 0 10px;
  }
  h1 {
    font-size: clamp(28px, 4vw, 40px);
    margin: 0 0 20px;
    letter-spacing: -0.01em;
  }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab {
    font: inherit; font-size: 13px; letter-spacing: 0.02em;
    background: var(--panel); color: var(--text-2); border: 1px solid var(--panel-edge);
    border-radius: 999px; padding: 8px 18px; cursor: pointer; transition: 0.15s;
  }
  .tab:hover { color: var(--text-1); border-color: var(--melody); }
  .tab.active { color: var(--bg); background: var(--melody); border-color: var(--melody); font-weight: 600; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 20px;
  }

  .transport { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .play-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--melody); color: white; font-size: 16px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .play-btn:hover { filter: brightness(1.1); }
  .scrubber { flex: 1; min-width: 160px; accent-color: var(--melody); }
  .time { font-family: ui-monospace, monospace; font-size: 12.5px; color: var(--text-2); min-width: 90px; text-align: right; }
  .meta { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text-3); margin: 0 0 14px; }

  canvas { width: 100%; display: block; border-radius: 6px; background: #111113; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 14px 0 0; font-size: 12px; color: var(--text-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  .lyric {
    margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--panel-edge);
    font-size: 17px; line-height: 1.8; color: var(--text-3); letter-spacing: 0.01em;
  }
  .lyric .letter { transition: color 0.08s, text-shadow 0.08s; }
  .lyric .letter.active { color: var(--melody); text-shadow: 0 0 12px rgba(57, 135, 229, 0.6); font-weight: 700; }

  footer { margin-top: 28px; font-size: 12.5px; color: var(--text-3); text-align: center; }
  footer a { color: var(--text-2); }
</style>
</head>
<body>
<main>
  <p class="kicker">NeuroSonix &middot; Interactive Player</p>
  <h1>Hear the text become the score</h1>

  <div class="tabs" id="tabs"></div>

  <div class="panel">
    <p class="meta" id="meta"></p>
    <div class="transport">
      <button class="play-btn" id="playBtn" aria-label="Play">▶</button>
      <input type="range" class="scrubber" id="scrubber" min="0" max="1000" value="0">
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
    <canvas id="roll" width="1400" height="480"></canvas>
    <div class="legend" id="legend"></div>
    <p class="lyric" id="lyric"></p>
  </div>

  <audio id="audio" preload="auto"></audio>

  <footer>NeuroSonix &middot; <a href="https://github.com/Fareed-Barakeh/Neuro-Sonix" target="_blank">github.com/Fareed-Barakeh/Neuro-Sonix</a></footer>
</main>

<script src="neurosonix-data.js"></script>
<script>
(function () {
  const TRACK_COLOR = {
    melody: 'var(--melody)', harmony: 'var(--harmony)', bass: 'var(--bass)',
    countermelody: 'var(--countermelody)', arpeggio: 'var(--arpeggio)',
  };
  const TRACK_LABEL = {
    melody: 'Melody (text)', harmony: 'Harmony (Markov chords)', bass: 'Bass',
    countermelody: 'Countermelody', arpeggio: 'Arpeggio', percussion: 'Percussion',
  };
  const DRUM_COLOR = { 36: 'var(--perc-kick)', 42: 'var(--perc-hihat)', 49: 'var(--perc-crash)' };
  const PITCHED_ORDER = ['bass', 'harmony', 'arpeggio', 'countermelody', 'melody'];

  const root = getComputedStyle(document.documentElement);
  function cssVar(v) { return v.startsWith('var(') ? root.getPropertyValue(v.slice(4, -1)).trim() : v; }

  const tabsEl = document.getElementById('tabs');
  const canvas = document.getElementById('roll');
  const ctx = canvas.getContext('2d');
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const scrubber = document.getElementById('scrubber');
  const timeEl = document.getElementById('time');
  const metaEl = document.getElementById('meta');
  const legendEl = document.getElementById('legend');
  const lyricEl = document.getElementById('lyric');

  let current = null;   // piece data
  let pieceId = null;
  let layout = null;    // computed geometry for the current piece
  let letterEls = [];   // <span> per melody letter, in order
  let raf = null;

  const ids = Object.keys(NEUROSONIX_PIECES);
  ids.forEach((id, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === 0 ? ' active' : '');
    btn.textContent = id.charAt(0).toUpperCase() + id.slice(1);
    btn.onclick = () => loadPiece(id);
    btn.dataset.id = id;
    tabsEl.appendChild(btn);
  });

  function fmtTime(s) {
    if (!isFinite(s)) s = 0;
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  function computeLayout(piece) {
    const pitched = PITCHED_ORDER.filter(t => piece.tracks[t] && piece.tracks[t].length);
    let notes = [];
    pitched.forEach(t => piece.tracks[t].forEach(e => notes.push(e.note)));
    const lo = Math.min(...notes) - 2, hi = Math.max(...notes) + 2;
    const hasPerc = piece.tracks.percussion && piece.tracks.percussion.length > 0;
    const percLaneH = hasPerc ? 40 : 0;
    const topMargin = 26, bottomMargin = 10;
    const width = canvas.width, height = canvas.height;
    const rollH = height - topMargin - bottomMargin - percLaneH;
    const beats = piece.length_beats + 1;
    const xScale = (width - 20) / beats;
    const yScale = rollH / (hi - lo + 1.5);
    const noteY = (n) => topMargin + rollH - (n - lo) * yScale;
    const beatX = (b) => 12 + b * xScale;
    return { pitched, lo, hi, hasPerc, percLaneH, topMargin, rollH, xScale, yScale, noteY, beatX, width, height };
  }

  function drawStatic(piece, geo) {
    ctx.clearRect(0, 0, geo.width, geo.height);
    ctx.fillStyle = '#111113';
    ctx.fillRect(0, 0, geo.width, geo.height);

    // chord shading + roman numerals
    ctx.font = '10px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(217,89,38,0.07)';
    piece.chords.forEach(c => {
      ctx.fillRect(geo.beatX(c.start), geo.topMargin, geo.xScale * c.dur, geo.rollH);
    });
    ctx.fillStyle = '#c9946b';
    piece.chords.forEach(c => {
      ctx.fillText(c.roman, geo.beatX(c.start) + 2, geo.topMargin + 10);
    });

    // mark scale changes, if this piece modulates
    let prevKey = null;
    ctx.strokeStyle = '#5a5f6e';
    ctx.setLineDash([3, 3]);
    ctx.font = 'italic 9px ui-monospace, monospace';
    piece.chords.forEach(c => {
      if (c.key !== prevKey) {
        const x = geo.beatX(c.start);
        ctx.beginPath(); ctx.moveTo(x, geo.topMargin); ctx.lineTo(x, geo.topMargin + geo.rollH); ctx.stroke();
        ctx.fillStyle = '#8f96a8';
        ctx.fillText(c.key, x + 3, geo.topMargin - 4);
        prevKey = c.key;
      }
    });
    ctx.setLineDash([]);

    // pitched tracks
    geo.pitched.forEach(t => {
      const color = cssVar(TRACK_COLOR[t]);
      piece.tracks[t].forEach(e => {
        const alpha = 0.28 + 0.4 * (e.vel / 127);
        ctx.fillStyle = hexToRgba(color, alpha);
        const x = geo.beatX(e.start), y = geo.noteY(e.note) - 5;
        const w = Math.max(geo.xScale * e.dur, 2);
        roundRect(ctx, x, y, w, 10, 2);
        ctx.fill();
      });
    });

    // percussion lane
    if (geo.hasPerc) {
      const laneY = geo.topMargin + geo.rollH + 6;
      ctx.strokeStyle = '#26262a';
      ctx.beginPath(); ctx.moveTo(0, laneY - 4); ctx.lineTo(geo.width, laneY - 4); ctx.stroke();
      piece.tracks.percussion.forEach(e => {
        const color = cssVar(DRUM_COLOR[e.note] || '#ffffff');
        const h = e.note === 42 ? 10 : e.note === 49 ? 22 : 16;
        ctx.fillStyle = hexToRgba(color, 0.5 + 0.4 * (e.vel / 127));
        ctx.fillRect(geo.beatX(e.start), laneY + (22 - h), Math.max(geo.xScale * e.dur, 2), h);
      });
    }
  }

  function drawPlayhead(geo, beat) {
    const x = geo.beatX(beat);
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x, 4); ctx.lineTo(x, geo.height - 4); ctx.stroke();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function hexToRgba(hex, a) {
    hex = hex.trim();
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return `rgba(${r},${g},${b},${a})`;
  }

  function buildLegend(piece, geo) {
    legendEl.innerHTML = '';
    const tracks = geo.pitched.concat(geo.hasPerc ? ['percussion'] : []);
    tracks.forEach(t => {
      const swatchColor = t === 'percussion' ? cssVar('var(--perc-hihat)') : cssVar(TRACK_COLOR[t]);
      const item = document.createElement('span');
      item.innerHTML = `<span class="swatch" style="background:${swatchColor}"></span>${TRACK_LABEL[t]}`;
      legendEl.appendChild(item);
    });
  }

  function buildLyric(piece) {
    lyricEl.innerHTML = '';
    letterEls = [];
    let letterIdx = 0;
    for (const ch of piece.text) {
      if (/[a-zA-Z]/.test(ch)) {
        const span = document.createElement('span');
        span.className = 'letter';
        span.textContent = ch;
        lyricEl.appendChild(span);
        letterEls.push(span);
        letterIdx++;
      } else {
        lyricEl.appendChild(document.createTextNode(ch));
      }
    }
  }

  function loadPiece(id) {
    pieceId = id;
    current = NEUROSONIX_PIECES[id];
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.id === id));
    layout = computeLayout(current);
    drawStatic(current, layout);
    drawPlayhead(layout, 0);
    buildLegend(current, layout);
    buildLyric(current);
    metaEl.textContent = `Key: ${current.key}  ·  Tempo: ${Math.round(current.tempo_bpm)} BPM  ·  ` +
      `${current.tracks.melody.length} letters  ·  ${fmtTime(current.length_seconds)}`;
    audio.src = id + '.mp3';  // <piece-id>.mp3 sits alongside this page and neurosonix-data.js
    audio.pause();
    playBtn.textContent = '▶';
    scrubber.value = 0;
    timeEl.textContent = `0:00 / ${fmtTime(current.length_seconds)}`;
  }

  function frame() {
    const t = audio.currentTime;
    const beat = t * current.tempo_bpm / 60;
    drawStatic(current, layout);
    drawPlayhead(layout, beat);

    let activeIdx = -1;
    current.tracks.melody.forEach((e, i) => {
      if (t >= e.start * 60 / current.tempo_bpm && t < (e.start + e.dur) * 60 / current.tempo_bpm) activeIdx = i;
    });
    letterEls.forEach((el, i) => el.classList.toggle('active', i === activeIdx));

    scrubber.value = current.length_seconds ? (t / current.length_seconds) * 1000 : 0;
    timeEl.textContent = `${fmtTime(t)} / ${fmtTime(current.length_seconds)}`;

    if (!audio.paused && !audio.ended) {
      raf = requestAnimationFrame(frame);
    } else if (audio.ended) {
      playBtn.textContent = '▶';
    }
  }

  playBtn.onclick = () => {
    if (audio.paused) {
      audio.play();
      playBtn.textContent = '❚❚';
      raf = requestAnimationFrame(frame);
    } else {
      audio.pause();
      playBtn.textContent = '▶';
      if (raf) cancelAnimationFrame(raf);
    }
  };

  scrubber.oninput = () => {
    const frac = scrubber.value / 1000;
    audio.currentTime = frac * current.length_seconds;
    if (audio.paused) frame();
  };

  const requested = new URLSearchParams(location.search).get('piece');
  loadPiece(ids.includes(requested) ? requested : ids[0]);
})();
</script>
</body>
</html>
